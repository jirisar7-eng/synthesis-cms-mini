name: Genesis Integrity

on:
  push:
    branches:
      - main
      - 'task/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  genesis-integrity:
    name: Verify Genesis Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify Node.js version
        run: node --version

      - name: Check validator syntax
        run: node --check scripts/governance/verify_genesis.mjs

      - name: Verify Genesis anchor
        run: node scripts/governance/verify_genesis.mjs

      - name: Run validator behavioral self-tests
        run: node scripts/governance/verify_genesis.mjs --self-test

      - name: Check Command Capsule validator syntax
        run: node --check scripts/governance/validate_command_capsule.mjs

      - name: Run Command Capsule structural validator self-tests
        run: node scripts/governance/validate_command_capsule.mjs --self-test

      - name: Check cryptographic Command Capsule verifier syntax
        run: node --check scripts/governance/verify_capsule_seal.mjs

      - name: Run cryptographic Command Capsule verifier self-tests
        run: node scripts/governance/verify_capsule_seal.mjs --self-test

      - name: Verify actual committed Command Capsule files
        run: |
          set -euo pipefail
          dir=".synthesis/task-capsules"
          if [[ ! -d "$dir" || -L "$dir" ]]; then
            echo "FAIL: Missing or unsafe capsule directory"
            exit 1
          fi

          shopt -s nullglob dotglob
          entries=("$dir"/*)
          if (( ${#entries[@]} == 0 )); then
            echo "FAIL: No Command Capsule files found"
            exit 1
          fi

          verified=0
          for file in "${entries[@]}"; do
            if [[ ! -f "$file" || -L "$file" || "$file" != *.json ]]; then
              echo "FAIL: Unexpected or unsafe capsule entry: $file"
              exit 1
            fi
            node scripts/governance/validate_command_capsule.mjs "$file"
            result="$(node scripts/governance/verify_capsule_seal.mjs --verify "$file")"
            printf '%s\n' "$result"
            if ! grep -Fxq 'PAYLOAD_HASH_MATCH: YES' <<< "$result"; then
              echo "FAIL: Capsule lacks a verified SEALED payload hash: $file"
              exit 1
            fi
            verified=$((verified + 1))
          done

          if (( verified == 0 )); then
            echo "FAIL: Zero verified Command Capsules"
            exit 1
          fi
          echo "REAL_CAPSULES_VERIFIED: $verified"

      - name: Check Command Capsule parent-lineage verifier syntax
        run: node --check scripts/governance/verify_capsule_lineage.mjs

      - name: Run Command Capsule parent-lineage verifier self-tests
        run: node scripts/governance/verify_capsule_lineage.mjs --self-test

      - name: Verify complete committed Command Capsule parent lineage
        run: node scripts/governance/verify_capsule_lineage.mjs --verify-all

      - name: Check detached Command Capsule baseline verifier syntax
        run: node --check scripts/governance/verify_capsule_file_baseline.mjs

      - name: Run detached Command Capsule baseline verifier self-tests
        run: node scripts/governance/verify_capsule_file_baseline.mjs --self-test

      - name: Verify committed Command Capsule full-file baseline
        run: node scripts/governance/verify_capsule_file_baseline.mjs --verify-all

      - name: Check Command Capsule attestation-chain verifier syntax
        run: node --check scripts/governance/verify_capsule_attestation_chain.mjs

      - name: Run Command Capsule attestation-chain verifier self-tests
        run: node scripts/governance/verify_capsule_attestation_chain.mjs --self-test

      - name: Verify complete committed Command Capsule attestation chain
        run: node scripts/governance/verify_capsule_attestation_chain.mjs --verify-all

      - name: Check Capability Schema verifier syntax
        run: node --check scripts/governance/verify_capability_schema.mjs

      - name: Run Capability Schema verifier self-tests
        run: node scripts/governance/verify_capability_schema.mjs --self-test

      - name: Verify Capability Schema integrity
        run: node scripts/governance/verify_capability_schema.mjs --verify-all

      - name: Check Capability Registry validator syntax
        run: node --check scripts/governance/validate_capability_registry.mjs

      - name: Run Capability Registry validator self-tests
        run: node scripts/governance/validate_capability_registry.mjs --self-test

      - name: Verify committed Capability Registry instance
        run: node scripts/governance/validate_capability_registry.mjs --verify-all

      - name: Check Source Blob verifier syntax
        run: node --check scripts/governance/verify_source_blob_provenance.mjs

      - name: Run Source Blob verifier self-tests
        run: node scripts/governance/verify_source_blob_provenance.mjs --self-test

      - name: Verify committed source-blob provenance
        run: node scripts/governance/verify_source_blob_provenance.mjs --verify-all

      - name: Check Scope & Diff Firewall validator syntax
        run: node --check scripts/governance/verify_scope_diff_firewall.mjs

      - name: Run Scope & Diff Firewall behavioral self-tests
        run: node scripts/governance/verify_scope_diff_firewall.mjs --self-test

      - name: Verify context-aware Scope & Diff Firewall
        run: |
          set -euo pipefail
          node - << 'EOF'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";
          import { verifyPostCommitDiff, validateCliCapsulePath } from "./scripts/governance/verify_scope_diff_firewall.mjs";

          const repoRoot = process.cwd();
          function git(args, cwd = repoRoot) {
            return execFileSync("git", args, { cwd, encoding: "utf8" }).trim();
          }

          const eventName = process.env.GITHUB_EVENT_NAME || "push";
          const ref = process.env.GITHUB_REF || "";
          const eventPath = process.env.GITHUB_EVENT_PATH;
          let eventData = {};
          if (eventPath && fs.existsSync(eventPath)) {
            try {
              eventData = JSON.parse(fs.readFileSync(eventPath, "utf8"));
            } catch (e) {
              console.error("FAIL: Could not parse GITHUB_EVENT_PATH:", e.message);
              process.exit(1);
            }
          }

          console.log(`Verifying Scope & Diff Firewall for event: ${eventName}, ref: ${ref}`);

          function verifyCommitInWorktree(commitSha, parentSha) {
            console.log(`Verifying command commit: ${commitSha} (parent: ${parentSha})`);
            const rawDiff = git(["diff-tree", "-r", "--raw", "-z", "--no-commit-id", parentSha, commitSha]);
            const tokens = rawDiff.split("\0").filter(Boolean);
            const newCapsules = [];
            const newAttestations = [];

            let i = 0;
            while (i < tokens.length) {
              const header = tokens[i];
              i++;
              if (!header.startsWith(":")) {
                throw new Error(`MALFORMED_DIFF_HEADER: Diff header must start with ':': ${header}`);
              }
              const parts = header.slice(1).split(/\s+/);
              if (parts.length < 5) {
                throw new Error(`MALFORMED_DIFF_HEADER: Diff header has fewer than 5 components: ${header}`);
              }
              const status = parts[4];
              const filePath = tokens[i];
              i++;
              if (!filePath) {
                throw new Error(`MALFORMED_DIFF_RECORD: Missing path for header: ${header}`);
              }
              if (status.startsWith("R") || status.startsWith("C")) {
                const origPath = tokens[i];
                i++;
                throw new Error(`UNSUPPORTED_RENAME_COPY: Rename/copy forbidden in diff: ${origPath} -> ${filePath}`);
              }
              if (status === "A") {
                if (filePath.startsWith(".synthesis/task-capsules/CAP-") && filePath.endsWith(".json")) {
                  if (newCapsules.includes(filePath)) {
                    throw new Error(`DUPLICATE_CAPSULE_PATH: Duplicate capsule in diff: ${filePath}`);
                  }
                  newCapsules.push(filePath);
                }
                if (filePath.startsWith(".synthesis/attestations/ATT-") && filePath.endsWith(".json")) {
                  if (newAttestations.includes(filePath)) {
                    throw new Error(`DUPLICATE_ATTESTATION_PATH: Duplicate attestation in diff: ${filePath}`);
                  }
                  newAttestations.push(filePath);
                }
              }
            }

            if (newCapsules.length !== 1) {
              throw new Error(`Commit ${commitSha} must introduce exactly 1 Command Capsule, found: ${newCapsules.length} (${newCapsules.join(", ")})`);
            }
            if (newAttestations.length !== 1) {
              throw new Error(`Commit ${commitSha} must introduce exactly 1 Attestation, found: ${newAttestations.length} (${newAttestations.join(", ")})`);
            }

            const capsuleRelPath = newCapsules[0];
            const currentHead = git(["rev-parse", "HEAD"]);

            let verifyRoot = repoRoot;
            let cleanupWorktree = null;

            if (currentHead !== commitSha) {
              cleanupWorktree = path.join("/tmp", `worktree-check-${commitSha.slice(0, 10)}-${Date.now()}`);
              git(["worktree", "add", "--detach", cleanupWorktree, commitSha]);
              verifyRoot = cleanupWorktree;
            }

            try {
              const { capsule } = validateCliCapsulePath(capsuleRelPath, verifyRoot);
              const res = verifyPostCommitDiff(capsule, parentSha, commitSha, verifyRoot);
              console.log(`Commit ${commitSha} Scope & Diff check: PASS`, res);
            } finally {
              if (cleanupWorktree) {
                try {
                  git(["worktree", "remove", "--force", cleanupWorktree]);
                } catch (e) {
                  // ignore cleanup error
                }
              }
            }
          }

          if (eventName === "push" && ref.startsWith("refs/heads/task/")) {
            const headSha = git(["rev-parse", "HEAD"]);
            const expectedSha = process.env.GITHUB_SHA;
            if (expectedSha && headSha !== expectedSha) {
              throw new Error(`HEAD mismatch: checkout HEAD (${headSha}) !== GITHUB_SHA (${expectedSha})`);
            }
            const parents = git(["rev-parse", `${headSha}^@`]).split(/\s+/).filter(Boolean);
            if (parents.length !== 1) {
              throw new Error(`Task branch push HEAD must have exactly 1 direct parent, found: ${parents.length}`);
            }
            verifyCommitInWorktree(headSha, parents[0]);
          } else if (eventName === "pull_request") {
            const pr = eventData.pull_request;
            if (!pr) throw new Error("Missing pull_request object in event payload");
            const headRepo = pr.head?.repo?.full_name;
            const expectedRepo = process.env.GITHUB_REPOSITORY;
            if (expectedRepo && headRepo !== expectedRepo) {
              throw new Error(`PR source repository mismatch: ${headRepo} !== ${expectedRepo}`);
            }
            const headRef = pr.head?.ref || "";
            if (!headRef.startsWith("task/")) {
              throw new Error(`PR source branch must start with task/, got: ${headRef}`);
            }
            const prHeadSha = pr.head?.sha;
            const prBaseSha = pr.base?.sha;
            if (!prHeadSha || !prBaseSha) {
              throw new Error(`Missing PR head (${prHeadSha}) or base (${prBaseSha}) SHA`);
            }
            console.log(`Verifying PR ${pr.number}: base=${prBaseSha}, head=${prHeadSha}`);
            const commitList = git(["rev-list", "--topo-order", "--reverse", `${prBaseSha}..${prHeadSha}`]).split(/\s+/).filter(Boolean);
            if (commitList.length === 0) {
              throw new Error(`PR contains 0 new commits between ${prBaseSha} and ${prHeadSha}`);
            }
            let currentBase = prBaseSha;
            for (const commit of commitList) {
              const parents = git(["rev-parse", `${commit}^@`]).split(/\s+/).filter(Boolean);
              if (parents.length !== 1 || parents[0] !== currentBase) {
                throw new Error(`PR commit ${commit} parent mismatch: expected ${currentBase}, got: ${parents.join(", ")}`);
              }
              verifyCommitInWorktree(commit, currentBase);
              currentBase = commit;
            }
          } else if (eventName === "push" && ref === "refs/heads/main") {
            const headSha = git(["rev-parse", "HEAD"]);
            const parents = git(["rev-parse", `${headSha}^@`]).split(/\s+/).filter(Boolean);
            if (parents.length === 1) {
              verifyCommitInWorktree(headSha, parents[0]);
            } else if (parents.length === 2) {
              const mainParent = parents[0];
              const taskParent = parents[1];
              console.log(`Verifying main merge commit: mainParent=${mainParent}, taskParent=${taskParent}`);
              const taskCommits = git(["rev-list", "--topo-order", "--reverse", `${mainParent}..${taskParent}`]).split(/\s+/).filter(Boolean);
              if (taskCommits.length === 0) {
                throw new Error(`Merge commit introduced 0 commits from taskParent ${taskParent}`);
              }
              let currentBase = mainParent;
              for (const commit of taskCommits) {
                const cParents = git(["rev-parse", `${commit}^@`]).split(/\s+/).filter(Boolean);
                if (cParents.length !== 1 || cParents[0] !== currentBase) {
                  throw new Error(`Task commit ${commit} in merge has unexpected parent: ${cParents.join(", ")}, expected ${currentBase}`);
                }
                verifyCommitInWorktree(commit, currentBase);
                currentBase = commit;
              }
              const mergeDiff = git(["diff-tree", "-r", "--name-only", taskParent, headSha]);
              if (mergeDiff.trim().length > 0) {
                throw new Error(`Main merge commit contains changes outside taskParent: ${mergeDiff}`);
              }
            } else {
              throw new Error(`Unsupported commit parent structure on main: ${parents.length} parents`);
            }
          } else {
            throw new Error(`UNSUPPORTED_EVENT_CONTEXT: Event ${eventName} with ref ${ref} is not supported`);
          }
          console.log("SCOPE_DIFF_FIREWALL_VERIFICATION: PASS");
          EOF
