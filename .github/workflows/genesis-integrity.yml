name: Genesis Integrity

on:
  push:
    branches:
      - main
      - 'task/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  genesis-integrity:
    name: Verify Genesis Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify Node.js version
        run: node --version

      - name: Check validator syntax
        run: node --check scripts/governance/verify_genesis.mjs

      - name: Verify Genesis anchor
        run: node scripts/governance/verify_genesis.mjs

      - name: Run validator behavioral self-tests
        run: node scripts/governance/verify_genesis.mjs --self-test

      - name: Check Command Capsule validator syntax
        run: node --check scripts/governance/validate_command_capsule.mjs

      - name: Run Command Capsule structural validator self-tests
        run: node scripts/governance/validate_command_capsule.mjs --self-test

      - name: Check cryptographic Command Capsule verifier syntax
        run: node --check scripts/governance/verify_capsule_seal.mjs

      - name: Run cryptographic Command Capsule verifier self-tests
        run: node scripts/governance/verify_capsule_seal.mjs --self-test

      - name: Verify actual committed Command Capsule files
        run: |
          set -euo pipefail

          dir=".synthesis/task-capsules"

          if [[ ! -d "$dir" || -L "$dir" ]]; then
            echo "FAIL: Missing or unsafe capsule directory"
            exit 1
          fi

          shopt -s nullglob dotglob

          entries=("$dir"/*)

          if (( ${#entries[@]} == 0 )); then
            echo "FAIL: No Command Capsule files found"
            exit 1
          fi

          verified=0

          for file in "${entries[@]}"; do
            if [[ ! -f "$file" || -L "$file" || "$file" != *.json ]]; then
              echo "FAIL: Unexpected or unsafe capsule entry: $file"
              exit 1
            fi

            node scripts/governance/validate_command_capsule.mjs "$file"

            result="$(node scripts/governance/verify_capsule_seal.mjs --verify "$file")"

            printf '%s\n' "$result"

            if ! grep -Fxq 'PAYLOAD_HASH_MATCH: YES' <<< "$result"; then
              echo "FAIL: Capsule lacks a verified SEALED payload hash: $file"
              exit 1
            fi

            verified=$((verified + 1))
          done

          if (( verified == 0 )); then
            echo "FAIL: Zero verified Command Capsules"
            exit 1
          fi

          echo "REAL_CAPSULES_VERIFIED: $verified"
